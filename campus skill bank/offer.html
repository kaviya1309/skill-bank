<!DOCTYPE html>
<html>
<head>
    <title>Offer a Skill</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h2>Campus Skill Bank</h2>

    <nav>
        <a href="index.html">Home</a>
        <a href="explore.html">Explore Skills</a>
        <a href="offer.html">Offer a Skill</a>
        <a href="wallet.html">My Wallet</a>
    </nav>
</header>

<section class="page-title">

    <p class="small-title">SHARE YOUR KNOWLEDGE</p>

    <h1>Offer a Skill</h1>

    <p>
        Teach a skill and earn time credits.
    </p>

</section>

<section class="form-box">

    <form>

        <label>Your Name</label>
        <input type="text" placeholder="Enter your name">

        <label>Skill Name</label>
        <input type="text" placeholder="Example: C Programming">

        <label>Category</label>

        <select>
            <option>Technology</option>
            <option>Design</option>
            <option>Music</option>
            <option>Languages</option>
            <option>Academics</option>
        </select>

        <label>Available Hours</label>
        <input type="number" placeholder="Example: 2">

        <label>About Your Skill</label>
        <textarea placeholder="Describe your skill"></textarea>

        <button type="button">Offer My Skill</button>

    </form>

</section>

<footer>
    <p>© 2026 Campus Skill Bank</p>
</footer>

</body>
</html>
